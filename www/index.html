<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ruffing Game</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#0b1020;font:600 16px system-ui,sans-serif;color:#ffe9c7;touch-action:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#menu{background:linear-gradient(#0b102088,#0b1020cc)}
h1{font-size:clamp(38px,10vw,76px);line-height:.92;text-align:center;letter-spacing:3px;color:#ff7a3d;text-shadow:0 4px 0 #0b1020,0 0 30px #ff7a3d66}
h2{font-size:22px;margin-bottom:6px}h3{font-size:14px;margin:14px 0 6px;color:#ff7a3d}
button{font:inherit;color:#0b1020;background:#ff7a3d;border:0;border-radius:12px;padding:12px 22px;min-width:210px}
button:active{transform:scale(.97)}
button small{display:block;font-weight:400;font-size:11px;opacity:.75}
.pn{width:min(560px,100%);max-height:100%;overflow:auto;touch-action:pan-y;background:#111830f2;border:1px solid #ffe9c733;border-radius:16px;padding:16px}
.pn button{min-width:0}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gg button{background:#27314f;color:#ffe9c7;text-align:left;padding:10px}
.gg .on{background:#ff7a3d;color:#0b1020}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
input[type=range]{width:52%;accent-color:#ff7a3d}
.t{background:#27314f;color:#ffe9c7;padding:8px 14px}
.f{font-size:10px;font-weight:400;color:#777;text-align:center;margin-top:14px}
#gt{margin:6px 0;min-height:24px}
.it{display:block;width:100%;text-align:left;margin:6px 0;background:#27314f;color:#ffe9c7}
#lg li{margin:4px 0 4px 18px;font-weight:400;font-size:14px}
#hud{display:block;pointer-events:none;padding:0}
#hud button{pointer-events:auto;position:absolute;min-width:0}
#st{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;background:#0b1020bb;padding:7px 12px;border-radius:10px}
#bm{top:calc(10px + env(safe-area-inset-top));right:12px;padding:8px 14px}
#bs{top:calc(10px + env(safe-area-inset-top));right:66px;padding:8px 14px}
#act,#act2{left:50%;transform:translateX(-50%);padding:12px 20px}
#act{bottom:calc(66px + env(safe-area-inset-bottom))}#act2{bottom:calc(14px + env(safe-area-inset-bottom));background:#27314f;color:#ffe9c7}
#tip{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0b1020bb;padding:6px 12px;border-radius:10px;white-space:nowrap}#tip:empty{display:none}
#ch{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff9}
#jb{display:none;position:fixed;border-radius:50%;background:#ffe9c722;border:2px solid #ffe9c777;pointer-events:none}
#jb i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:#ffe9c7cc}
#osu{position:fixed;inset:0;z-index:30;background:#0b102066;touch-action:none}
.o{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#ff7a3d;display:flex;align-items:center;justify-content:center;color:#0b1020;font-size:22px}
.o::after{content:'';position:absolute;inset:-5px;border:4px solid #ffe9c7;border-radius:50%;animation:ap var(--t) linear forwards;pointer-events:none}
@keyframes ap{from{transform:scale(3);opacity:.2}to{transform:scale(1);opacity:1}}
#toast{position:fixed;z-index:40;top:16%;left:50%;transform:translateX(-50%);max-width:88%;text-align:center;background:#0b1020e6;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#fl{position:fixed;inset:0;z-index:35;opacity:0;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>

<div id="menu" class="scr">
<h1>RUFFING<br>GAME</h1>
<button id="bp">▶ Играть</button>
<button id="bst">⚙ Настройки</button>
<button id="bl">📜 Дневник изменений</button>
</div>

<div id="hud" class="scr" hidden>
<div id="st"></div><button id="bs">🛒</button><button id="bm">☰</button><div id="ch"></div>
<div id="tip"></div><button id="act" hidden>📸 Снимок</button><button id="act2" hidden>⬇ Спуститься</button>
<div id="jb"><i></i></div>
</div>

<div id="set" class="scr" hidden><div class="pn">
<h2>Настройки</h2>
<h3>Графика</h3>
<div class="gg">
<button data-g="1">1 · Картошка<small>ультра-уродливая, тянет на калькуляторе в 1487 FPS</small></button>
<button data-g="2">2 · Низкая<small>получше, но всё ещё плохо</small></button>
<button data-g="3">3 · Средняя<small>уровень игр D One Games</small></button>
<button data-g="4">4 · Высокая<small>имба</small></button>
</div>
<label>Тени <button class="t" data-t="sh" data-l="Выкл|Вкл"></button></label>
<h3>Звук</h3>
<label>Громкость и музыка <input type="range" data-k="vol" min="0" max="1" step=".01"></label>
<label>Фоновый шум (птицы, город) <input type="range" data-k="amb" min="0" max="1" step=".01"></label>
<label>Чувствительность <input type="range" data-k="sens" min="0" max="1" step=".01"></label>
<h3>Интерфейс</h3>
<label>Размер джойстика <input type="range" data-k="js" min=".6" max="1.6" step=".05"></label>
<label>Зона джойстика <input type="range" data-k="zone" min=".25" max=".6" step=".01"></label>
<label>Инвертировать управление <button class="t" data-t="inv" data-l="Выкл|Вкл"></button></label>
<label>Версия для <button class="t" data-t="left" data-l="Правшей|Левшей"></button></label>
<h3>Язык</h3>
<div id="gt"></div>
<button id="bb1">Назад</button>
<p class="f">ⓘ aren squad all right reversed</p>
</div></div>

<div id="shop" class="scr" hidden><div class="pn"><h2>Магазин</h2><div id="sl"></div><button id="bb2">Назад</button></div></div>
<div id="log" class="scr" hidden><div class="pn"><h2>Дневник изменений</h2><div id="lg"></div><button id="bb3">Назад</button></div></div>
<div id="osu" hidden></div><div id="toast"></div><div id="fl"></div>

<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script>function gti(){new google.translate.TranslateElement({pageLanguage:'ru',layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'gt')}</script>
<script src="https://translate.google.com/translate_a/element.js?cb=gti" async></script>
<script src="js/config.js"></script>
<script src="js/scene.js"></script>
<script src="js/shaders.js"></script>
<script src="js/city.js"></script>
<script src="js/graphics.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/controls.js"></script>
<script src="js/stairs.js"></script>
<script src="js/game.js"></script>
</body></html>
